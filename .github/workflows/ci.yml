name: CI

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm design:check
      - run: pnpm design:check:versions
      - run: npm ci
        working-directory: design/harness
      - run: npm ci
        working-directory: design/mockup
      - run: pnpm design:check:sources
      - run: pnpm check:contracts
      - run: pnpm check:command-surface
      - run: pnpm test:scripts
      - run: pnpm test
      - run: pnpm build
      # T181: Playwright had never run in CI — neither `test:e2e` nor the nightly config. The only
      # trace of it was the artifact upload below, for a `playwright-report/` directory nothing
      # generated. The 108 browser-harness tests were verified by hand in local runs, so a
      # regression stayed invisible until someone remembered to look (and one had: the ambient
      # glow's `inset: -15%` broke all six viewport projects).
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/desktop
      - run: pnpm test:e2e
      - run: pnpm check:traceability
      - run: pnpm licenses list --json > docs/licenses/npm.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore apps/sensor-agent/SensorAgent.sln --locked-mode
      - run: dotnet format apps/sensor-agent/SensorAgent.csproj --no-restore --verify-no-changes
      - run: dotnet build apps/sensor-agent/SensorAgent.csproj --no-restore
      - run: dotnet format apps/sensor-agent/Tests/SensorAgent.Tests.csproj --no-restore --verify-no-changes
      - run: dotnet build apps/sensor-agent/Tests/SensorAgent.Tests.csproj --no-restore
      - run: dotnet apps/sensor-agent/Tests/bin/Debug/net10.0-windows/SensorAgent.Tests.dll --no-progress
      - name: Show degraded catalog of the virtualized runner (T-INT-005)
        run: Get-Content apps/sensor-agent/Tests/bin/Debug/net10.0-windows/degraded-catalog.txt
      - run: dotnet tool install --global nuget-license --version 4.0.17
      - run: nuget-license -i apps/sensor-agent/SensorAgent.sln -t -o JsonPretty -fo docs/licenses/nuget.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy, llvm-tools-preview
      - name: Install Rust test tooling
        run: |
          cargo install cargo-nextest --version 0.9.145 --locked
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-about --version 0.8.2 --locked
      - name: Fetch the official PawnIO installer (not versioned; hash and Authenticode verified)
        run: node scripts/fetch-pawnio.mjs
      # T112 made `tauri.conf.json` bundle the self-contained collector, so `tauri-build` now fails
      # with "glob pattern ... didn't match any files" unless that publish output exists — which
      # broke every Rust step here. `--skip-signing` is what lets CI produce it: signing needs a
      # key, and none is required to compile. The signed manifest is `release.yml`'s job.
      - name: Publish the collector so the Tauri resource glob resolves
        run: node scripts/prepare-collector-bundle.mjs --skip-signing
      - run: cargo fmt --all -- --check
        working-directory: apps/desktop/src-tauri
      - run: cargo check --locked
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --locked -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: $env:RUSTFLAGS='-A linker_messages'; cargo nextest run --profile ci --no-tests=pass
        working-directory: apps/desktop/src-tauri
      - run: cargo llvm-cov --no-report --locked
        working-directory: apps/desktop/src-tauri
      - run: cargo deny check advisories licenses sources
        working-directory: apps/desktop/src-tauri
      - name: Report Rust duplicate dependencies
        continue-on-error: true
        run: cargo deny check bans
        working-directory: apps/desktop/src-tauri
      - run: cargo about generate -o ..\..\..\docs\licenses\rust-third-party.html ..\..\..\about.hbs
        working-directory: apps/desktop/src-tauri
      - run: pnpm licenses:sbom
      # T181: the native suite drives the real Tauri window over CDP, with its own throwaway data
      # directory (`TW_DEV_DATA_DIR`), so it never touches a real profile. Non-blocking for now on
      # purpose: it needs a GUI session and a CDP handshake on a virtualized runner, and neither is
      # proven stable here yet. Promote it to blocking once a few runs show it is.
      - name: Native E2E against the real binary (not blocking yet)
        continue-on-error: true
        run: |
          cargo build --locked --features e2e,custom-protocol --manifest-path apps/desktop/src-tauri/Cargo.toml
          pnpm --filter @throttlewatch/desktop test:e2e:native
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l00-test-artifacts
          path: |
            apps/desktop/coverage/
            apps/desktop/playwright-report/
          if-no-files-found: ignore
