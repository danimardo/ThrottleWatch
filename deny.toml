[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "GPL-3.0-only", "MIT", "BSD-3-Clause", "MPL-2.0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
