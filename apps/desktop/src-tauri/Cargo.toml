[package]
name = "throttlewatch"
version = "0.1.0"
description = "Diagnóstico térmico de CPU"
authors = ["ThrottleWatch contributors"]
edition = "2024"
license = "GPL-3.0-only"
default-run = "throttlewatch"

[features]
e2e = []
# T112: makes a release build trust the DEVELOPMENT signing key instead of the production one, so
# an installer can be built and tested end to end on a machine that does not hold the production
# secret (it lives only in the UPDATER_SIGNING_KEY GitHub secret). Never enabled by a real
# release: `release.yml` does not pass it, so production trust holds by construction.
dev-signing = []
# Embeds the built interface (`../dist`) instead of loading the dev server; `tauri build` enables it.
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "throttlewatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# T107: smaller, better-optimized binary for a lighter startup (NFR-002) and passive footprint
# (NFR-003) than cargo's release defaults (codegen-units = 16, no LTO, symbols kept). `panic` stays
# at its default (unwind), not `abort`, since neither Tauri's nor windows-rs's FFI boundaries have
# been audited for abort-safety here.
[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
jiff = "0.2.37"
minisign-verify = "0.2.5"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Performance", "Win32_System_Threading", "UI_ViewManagement"] }
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-opener = "2.5.5"
tauri-plugin-notification = "2.4.0"
tauri-plugin-updater = "2.11.0"

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }
proptest = "1.7.0"

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
disallowed_macros = "deny"
