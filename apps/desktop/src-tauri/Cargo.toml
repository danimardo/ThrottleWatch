[package]
name = "throttlewatch"
version = "0.1.0"
description = "Diagnóstico térmico de CPU"
authors = ["ThrottleWatch contributors"]
edition = "2024"
license = "GPL-3.0-only"

[features]
e2e = []

[lib]
name = "throttlewatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
rusqlite = { version = "0.34.0", features = ["bundled"] }

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
disallowed_macros = "deny"
